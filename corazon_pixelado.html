<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corazón Pixelado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b14; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #ff5c8a; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 0 6px #ff0040;
    background: rgba(0,0,0,0.4); padding: 6px 12px; border: 1px solid #ff0040;
  }
  .title {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    color: #ff5c8a; font-size: 34px; letter-spacing: 6px; font-weight: bold;
    text-transform: uppercase;
    text-shadow: 0 0 4px #ff0040, 0 0 10px #ff0040, 2px 2px 0 #5a0016;
    font-family: 'Courier New', monospace;
    image-rendering: pixelated;
    animation: pulseText 1s ease-in-out infinite;
  }
  @keyframes pulseText {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.08); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">TE AMO</div>
<div class="hud">♥ PIXEL HEART ♥</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Heart pixel art (1 = pixel on)
const heart = [
  "0011001100",
  "0111111110",
  "1111111111",
  "1111111111",
  "0111111110",
  "0011111100",
  "0001111000",
  "0000110000"
];

const PIXEL = 16;
const W = heart[0].length;
const H = heart.length;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let t = 0;
function draw() {
  t += 0.05;
  const beat = 1 + 0.12 * Math.pow(Math.sin(t * 3), 2) + 0.04 * Math.sin(t * 6);
  ctx.fillStyle = '#0b0b14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // subtle scanlines
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let y = 0; y < canvas.height; y += 4) {
    ctx.fillRect(0, y, canvas.width, 1);
  }

  const scale = beat;
  const px = PIXEL * scale;
  const totalW = W * px;
  const totalH = H * px;
  const ox = (canvas.width - totalW) / 2;
  const oy = (canvas.height - totalH) / 2;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (heart[y][x] === '1') {
        const glow = 0.6 + 0.4 * Math.sin(t * 3 + (x + y) * 0.3);
        // shadow
        ctx.fillStyle = 'rgba(80,0,20,0.6)';
        ctx.fillRect(ox + x * px + 2, oy + y * px + 2, px - 1, px - 1);
        // main
        ctx.fillStyle = `rgb(${220 + 35 * glow}, ${20 + 30 * glow}, ${60 + 20 * glow})`;
        ctx.fillRect(ox + x * px, oy + y * px, px - 1, px - 1);
        // highlight
        ctx.fillStyle = 'rgba(255,180,200,0.35)';
        ctx.fillRect(ox + x * px, oy + y * px, px - 1, 2);
      }
    }
  }

  // particles
  for (let i = 0; i < 6; i++) {
    const a = t * 0.7 + i * 1.1;
    const r = 120 + 40 * Math.sin(t + i);
    const pxp = ox + totalW / 2 + Math.cos(a) * r;
    const pyp = oy + totalH / 2 + Math.sin(a) * r * 0.6;
    ctx.fillStyle = `rgba(255,${80 + i * 20},120,${0.3 + 0.3 * Math.sin(t + i)})`;
    ctx.fillRect(Math.round(pxp / 4) * 4, Math.round(pyp / 4) * 4, 4, 4);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
